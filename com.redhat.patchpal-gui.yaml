app-id: com.redhat.patchpal-gui
runtime: org.gnome.Platform
runtime-version: '48'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.llvm20
command: patchpal
separate-locales: false
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --share=network
  - --device=dri
  - --filesystem=xdg-config

modules:
  # Copied from https://github.com/flathub/com.github.git_cola.git-cola/blob/master/git.json
  - name: git
    make-args:
      - INSTALL_SYMLINKS=1
    make-install-args:
      - INSTALL_SYMLINKS=1
    cleanup:
      - /lib/pkgconfig
      - /man
    sources:
      - type: archive
        url: https://www.kernel.org/pub/software/scm/git/git-2.49.0.tar.xz
        sha256: 618190cf590b7e9f6c11f91f23b1d267cd98c3ab33b850416d8758f8b5a85628
        x-checker-data:
          - type: anitya
            project-id: 5350
            stable-only: true
            url-template: "https://www.kernel.org/pub/software/scm/git/git-$version.tar.xz"
  - name: patchpal
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/llvm20/bin
      env:
        CARGO_HOME: /run/build/patchpal/cargo
        CARGO_NET_OFFLINE: 'true'
    sources:
      - type: git
        url: https://gitlab.com/patchpal-ai/patchpal-gui.git
        commit: 264c7964b55d718124efa53d918edfde9d859b9d
      - type: file
        path: patchpal-external.sh
      # See update-deps.sh
      - generated-sources.json
      # https://github.com/pascalkuthe/imara-diff/pull/26
      - type: patch
        path: 0001-Use-forked-imara-diff.patch
      - imara-diff-lock.json
    build-commands:
      - cargo --offline --verbose generate-lockfile
      - cargo --offline fetch --verbose --manifest-path Cargo.toml
      - cargo --offline build
      - mv target/debug/patchpal target/debug/patchpal-bin
      - install -Dm755 -t /app/bin target/debug/patchpal-bin target/debug/extractor
      - install -Dm755 -t /app/scripts patchpal-external.sh
