app-id: io.github.Axel051171.UnifiedFloppyTool
runtime: org.kde.Platform
sdk: org.kde.Sdk
runtime-version: '6.10'
command: UnifiedFloppyTool
rename-icon: UnifiedFloppyTool

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=ipc
  - --device=all

cleanup:
  - /include
  - "*.a"
  - "*.la"
  - /lib/pkgconfig

modules:

  - name: uft
    buildsystem: qmake
    config-opts:
      - UnifiedFloppyTool.pro
      - CONFIG+=release
    post-install:
      - install -Dm644 -t /app/share/icons/hicolor/scalable/apps/ resources/icons/UnifiedFloppyTool.svg
      - install -Dm644 packaging/linux/UnifiedFloppyTool.desktop /app/share/applications/${FLATPAK_ID}.desktop
    sources:
      - type: git
        url: https://github.com/Axel051171/UnifiedFloppyTool.git
        tag: v4.1.3
        commit: cf565660456eba5214a73dd197e423bb8aaee23c
      - type: patch
        path: app-install-dir.patch
      # https://github.com/Axel051171/UnifiedFloppyTool/issues/16
      - type: patch
        path: fortify-remove-dup.patch
      # https://github.com/Axel051171/UnifiedFloppyTool/pull/18
      - type: patch
        path: build-fixes.patch
      # https://github.com/Axel051171/UnifiedFloppyTool/issues/17
      - type: patch
        path: no-debug.patch
