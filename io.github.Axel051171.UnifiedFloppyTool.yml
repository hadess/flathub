app-id: io.github.Axel051171.UnifiedFloppyTool
runtime: org.kde.Platform
sdk: org.kde.Sdk
runtime-version: '6.10'
command: UnifiedFloppyTool
rename-icon: UnifiedFloppyTool

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=ipc
  - --device=all

cleanup:
  - /include
  - "*.a"
  - "*.la"
  - /lib/pkgconfig

modules:

  - python3-requirements.json
  - name: greaseweazle
    buildsystem: simple
    build-commands:
      - python3 -m pip install --prefix=/app --no-build-isolation .
    sources:
      - type: git
        url: https://github.com/keirf/greaseweazle.git
        tag: v1.23
        commit: a0ae343d7e2603b9f3fdc0149ef8e89de5399f58

  - name: uft
    buildsystem: qmake
    config-opts:
      - UnifiedFloppyTool.pro
      - CONFIG+=release
    post-install:
      - install -Dm644 -t /app/share/icons/hicolor/scalable/apps/ resources/icons/UnifiedFloppyTool.svg
      - install -Dm644 -t /app/share/metainfo/ packaging/flatpak/${FLATPAK_ID}.metainfo.xml
      - install -Dm644 -t /app/share/applications/ packaging/flatpak/${FLATPAK_ID}.desktop
    sources:
      - type: git
        url: https://github.com/Axel051171/UnifiedFloppyTool.git
        commit: d9e2be47c4051b843fc588308e774c87238c118c
      - type: patch
        path: app-install-dir.patch
